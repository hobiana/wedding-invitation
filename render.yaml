# render.yaml — l'infrastructure de l'invitation, décrite pour Render.
#
# Ce fichier est construit en trois fois : la base d'abord, puis l'API, puis le
# front. Chaque étage est appliqué et vérifié seul, pour qu'un échec désigne son
# étage sans ambiguïté. Étage courant : la base.
#
# Render relit ce fichier à chaque poussée sur `main`. Ce qui n'y figure pas
# n'est jamais touché.
#
# Validation dans l'éditeur : https://render.com/schema/render.yaml.json

databases:
  - name: hobiana-lova-db
    # Le nom de la base DANS l'instance. C'est celui que porte l'URL de
    # connexion, et il est immuable après création.
    databaseName: invitation_app

    # GRATUIT, ET TEMPORAIRE — À CHANGER AVANT LE 15 OCTOBRE 2026.
    #
    # Une base `free` devient inaccessible 30 jours après sa création, puis
    # Render laisse 14 jours pour la passer en payant avant de la supprimer
    # avec toutes ses données. Le passage en payant, lui, conserve les données :
    # c'est ce qui rend ce plan acceptable pour la phase de mise au point.
    #
    # Créée le 2026-09-15 : inaccessible vers le 15 octobre, supprimée vers le
    # 29 octobre. Les réponses des invités sont attendues jusqu'au 1er décembre.
    # Passer à `basic-256mb` avant la première invitation envoyée — c'est aussi
    # le premier palier qui sauvegarde en continu, et une réponse d'invité
    # perdue ne se redemande pas.
    #
    # `free` n'offre aucune sauvegarde. Tant que ce plan est actif, aucune
    # donnée réelle ne doit entrer dans cette base.
    plan: free

    # La région est immuable, et l'API devra être dans la MÊME : deux régions
    # différentes, c'est deux réseaux privés, donc pas de connexion interne.
    region: frankfurt

    # La même version majeure qu'en développement (docker-compose.yml), pour que
    # ce qui passe en local passe en production. Une chaîne, pas un nombre.
    postgresMajorVersion: "16"

    # `ipAllowList` absent = la base accepte une connexion depuis N'IMPORTE
    # QUELLE adresse du monde, pourvu qu'elle ait les identifiants. C'est le
    # défaut de Render, et c'est un choix, pas un oubli : les migrations,
    # l'amorçage et les `pg_dump` passent par l'URL externe, depuis la machine
    # du commanditaire, dont l'IP résidentielle change.
    #
    # ACCEPTABLE TANT QUE CETTE BASE EST UN BAC À SABLE VIDE.
    #
    # À FERMER EN MÊME TEMPS QUE LE PASSAGE EN `basic-256mb`, et avant que le
    # premier foyer réel n'y entre — à ce moment-là elle contient des données
    # personnelles : noms, numéros de téléphone, qui vient et qui ne vient pas.
    #
    #   ipAllowList:
    #     - source: <IP publique du commanditaire>/32
    #       description: migrations, amorçage et sauvegardes
    #
    # La liste ne concerne que l'accès externe : l'API, qui parle à la base par
    # le réseau privé de Frankfurt, n'est pas affectée. En revanche une IP
    # résidentielle change — il faudra la remettre à jour, ou y mettre la plage
    # du fournisseur d'accès.
