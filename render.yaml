# render.yaml — l'infrastructure de l'invitation, décrite pour Render.
#
# Ce fichier est construit en trois fois : la base d'abord, puis l'API, puis le
# front. Chaque étage est appliqué et vérifié seul, pour qu'un échec désigne son
# étage sans ambiguïté. Étage courant : la base.
#
# Render relit ce fichier à chaque poussée sur `main`. Ce qui n'y figure pas
# n'est jamais touché.
#
# Validation dans l'éditeur : https://render.com/schema/render.yaml.json

databases:
  - name: hobiana-lova-db
    # Le nom de la base DANS l'instance. C'est celui que porte l'URL de
    # connexion, et il est immuable après création.
    databaseName: invitation_app

    # GRATUIT, ET TEMPORAIRE — À CHANGER AVANT LE 15 OCTOBRE 2026.
    #
    # Une base `free` devient inaccessible 30 jours après sa création, puis
    # Render laisse 14 jours pour la passer en payant avant de la supprimer
    # avec toutes ses données. Le passage en payant, lui, conserve les données :
    # c'est ce qui rend ce plan acceptable pour la phase de mise au point.
    #
    # Créée le 2026-09-15 : inaccessible vers le 15 octobre, supprimée vers le
    # 29 octobre. Les réponses des invités sont attendues jusqu'au 1er décembre.
    # Passer à `basic-256mb` avant la première invitation envoyée — c'est aussi
    # le premier palier qui sauvegarde en continu, et une réponse d'invité
    # perdue ne se redemande pas.
    #
    # `free` n'offre aucune sauvegarde. Tant que ce plan est actif, aucune
    # donnée réelle ne doit entrer dans cette base.
    plan: free

    # La région est immuable, et l'API devra être dans la MÊME : deux régions
    # différentes, c'est deux réseaux privés, donc pas de connexion interne.
    region: frankfurt

    # La même version majeure qu'en développement (docker-compose.yml), pour que
    # ce qui passe en local passe en production. Une chaîne, pas un nombre.
    postgresMajorVersion: "16"

    # `ipAllowList` absent = la base accepte une connexion depuis N'IMPORTE
    # QUELLE adresse du monde, pourvu qu'elle ait les identifiants. C'est le
    # défaut de Render, et c'est un choix, pas un oubli : les migrations,
    # l'amorçage et les `pg_dump` passent par l'URL externe, depuis la machine
    # du commanditaire, dont l'IP résidentielle change.
    #
    # ACCEPTABLE TANT QUE CETTE BASE EST UN BAC À SABLE VIDE.
    #
    # À FERMER EN MÊME TEMPS QUE LE PASSAGE EN `basic-256mb`, et avant que le
    # premier foyer réel n'y entre — à ce moment-là elle contient des données
    # personnelles : noms, numéros de téléphone, qui vient et qui ne vient pas.
    #
    #   ipAllowList:
    #     - source: <IP publique du commanditaire>/32
    #       description: migrations, amorçage et sauvegardes
    #
    # La liste ne concerne que l'accès externe : l'API, qui parle à la base par
    # le réseau privé de Frankfurt, n'est pas affectée. En revanche une IP
    # résidentielle change — il faudra la remettre à jour, ou y mettre la plage
    # du fournisseur d'accès.

services:
  # ─────────────────────────────────────────────────────────────────────────
  # L'API NestJS, construite depuis le Dockerfile déjà présent dans le dépôt.
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: hobiana-lova-api
    runtime: docker

    # DOIT être la même région que la base. Deux régions différentes, c'est
    # deux réseaux privés : la chaîne de connexion interne ne résoudrait pas.
    region: frankfurt

    # GRATUIT ET TEMPORAIRE, comme la base — on met la chaîne au point.
    # Un service `free` s'endort après 15 minutes sans trafic et met près
    # d'une minute à se réveiller. Pour un invité qui ouvre son invitation à
    # 23 h, c'est une page blanche pendant une minute : passer à `starter`
    # avant d'envoyer la première invitation, en même temps que la base.
    plan: free

    branch: main

    # Le contexte de construction est la RACINE du dépôt, pas apps/api : le
    # Dockerfile copie pnpm-workspace.yaml, pnpm-lock.yaml et packages/shared
    # pour pouvoir résoudre le workspace entier. C'est aussi pour ça que le
    # .dockerignore qui compte est celui de la racine — Docker le résout
    # depuis le contexte, jamais depuis le dossier du Dockerfile.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .

    # GET /health renvoie {"status":"ok"} sans toucher la base. Un déploiement
    # dont la santé ne répond pas ne prend pas le trafic.
    healthCheckPath: /health

    envVars:
      # Bascule tout le comportement de production : cookie SameSite=None +
      # Secure, et surtout les cinq variables ci-dessous deviennent des
      # exigences dures — l'application refuse de démarrer sans elles
      # (src/config/env.validation.ts). C'est voulu : un déploiement à moitié
      # configuré doit échouer bruyamment, pas se connecter dans le vide.
      - key: NODE_ENV
        value: production

      # L'URL INTERNE, sur le réseau privé de Frankfurt : elle ne sort jamais
      # sur l'Internet public, et personne ne recopie un mot de passe à la main.
      # Pas besoin de `?sslmode=require` ici, contrairement à l'URL externe :
      # Render admet le texte clair sur le réseau privé.
      - key: DATABASE_URL
        fromDatabase:
          name: hobiana-lova-db
          property: connectionString

      # Produit par Render à la création, et jamais affiché. Personne n'a à le
      # connaître, donc personne ne peut le perdre ni le recopier ailleurs.
      - key: JWT_SECRET
        generateValue: true

      # `sync: false` = saisi dans le tableau de bord, jamais dans ce fichier.
      #
      # FRONTEND_URL n'est pas décoratif : c'est à la fois l'origine autorisée
      # par CORS et la valeur que la garde anti-CSRF compare. Une barre oblique
      # finale de trop, et le navigateur ne peut plus rien écrire.
      - key: FRONTEND_URL
        sync: false

      # Tant que Google n'est pas configuré, ces trois-là prennent un marqueur
      # non vide (`a-configurer` par exemple). La validation exige leur
      # PRÉSENCE, pas leur validité, et GoogleStrategy se rabat sur des
      # valeurs factices plutôt que de faire planter le module entier au
      # démarrage. Conséquence : l'application tourne, seul le bouton
      # « Se connecter avec Google » ne marche pas.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      # Les adresses autorisées à ouvrir une session par Google, séparées par
      # des virgules. Sans elles, n'importe quel compte Google entrerait.
      - key: ALLOWED_ADMIN_EMAILS
        sync: false

      # PORT n'est pas déclaré : Render l'injecte, et env.validation.ts lui
      # donne un défaut. Le fixer ici n'ajouterait qu'une occasion de se
      # contredire.
      #
      # ADMIN_SEED_EMAIL / ADMIN_SEED_PASSWORD non plus : l'amorçage se fait
      # depuis un poste, contre l'URL externe (voir docs/runbook-base-de-
      # donnees.md). Ces valeurs n'ont rien à faire à demeure dans
      # l'environnement du serveur.
